<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Collection | WatchEase Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/pages/cart.css">
    <link rel="stylesheet" href="../css/pages/home.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <script>if(localStorage.getItem('we-theme')==='dark')document.body.classList.add('dark')</script>

    <main class="container mb-5">
        <div class="cart-header">
            <h1>Your Collection</h1>
            <p class="text-muted">Review your selected timepieces before checkout.</p>
        </div>

        <div id="loading-state" class="loading-state">
            <p>Loading your collection…</p>
        </div>

        <div id="cart-content" style="display:none;">
            <div class="row g-5">
                <div class="col-lg-8" id="cart-items-container"></div>
                <div class="col-lg-4">
                    <div class="summary-card">
                        <h2 class="serif h4 mb-4">Summary</h2>
                        <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
                        <div class="summary-row"><span>Shipping</span><span>Complimentary</span></div>
                        <div class="summary-row"><span>Estimated Tax (5%)</span><span id="tax">₹0</span></div>
                        <div class="summary-row summary-total"><span>Total</span><span id="total">₹0</span></div>
                        <div class="btn-checkout-wrap" id="checkout-wrap">
                            <div class="strap strap--left"  id="strap-left"></div>
                            <div class="strap strap--right" id="strap-right"></div>
                            <button class="btn-checkout" id="checkout-btn" onclick="checkout()">
                                <span class="btn-checkout__label">Proceed to Checkout</span>
                                <div class="btn-checkout__dial" id="checkout-dial" aria-hidden="true"></div>
                            </button>
                        </div>
                        <div class="mt-4 text-center">
                            <p class="small text-muted">Secure checkout provided by WatchEase.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="empty-cart-state" class="empty-cart">
            <h2 class="serif">Your collection is empty.</h2>
            <p class="text-muted mb-4">Discover our latest engineering masterpieces.</p>
            <a href="men.html" class="btn btn-dark px-5 py-3" style="border-radius: 50px;">Shop Collection</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/navbar-inject.js"></script>
    <script type="module" src="../js/navbar.js"></script>
    <script type="module" src="../js/pages/cart.js"></script>
    <script type="module" src="../js/footer-inject.js"></script>
</body>
</html>
