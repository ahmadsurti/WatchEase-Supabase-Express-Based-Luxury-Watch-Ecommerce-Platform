<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchEase — Set New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/pages/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <script>if(localStorage.getItem('we-theme')==='dark')document.body.classList.add('dark')</script>
    <div class="container">

        <!-- ── Left animated panel ── -->
        <div class="left-section">
            <div class="brand"><span>WatchEase</span></div>
            <div class="character-container">
                <div class="characters-wrapper">
                    <div id="purple-char" class="character purple">
                        <div class="eyes-container" id="purple-eyes">
                            <div class="eye-ball white small"><div class="pupil black small"></div></div>
                            <div class="eye-ball white small"><div class="pupil black small"></div></div>
                        </div>
                    </div>
                    <div id="black-char" class="character black">
                        <div class="eyes-container" id="black-eyes">
                            <div class="eye-ball white x-small"><div class="pupil black x-small"></div></div>
                            <div class="eye-ball white x-small"><div class="pupil black x-small"></div></div>
                        </div>
                    </div>
                    <div id="orange-char" class="character orange">
                        <div class="eyes-container" id="orange-eyes">
                            <div class="pupil black medium"></div>
                            <div class="pupil black medium"></div>
                        </div>
                    </div>
                    <div id="yellow-char" class="character yellow">
                        <div class="eyes-container" id="yellow-eyes">
                            <div class="pupil black medium"></div>
                            <div class="pupil black medium"></div>
                        </div>
                        <div class="mouth" id="yellow-mouth"></div>
                    </div>
                </div>
            </div>
            <div class="grid-overlay"></div>
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>

        <!-- ── Right panel ── -->
        <div class="right-section">
            <div class="login-box">

                <div class="mobile-brand">
                    <div class="brand-icon"><i data-lucide="watch"></i></div>
                    <span>WatchEase</span>
                </div>

                <div class="header">
                    <h1>Set new password</h1>
                    <p>Choose a strong password for your account</p>
                </div>

                <div id="alert-container"></div>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="new-password" placeholder="••••••••" required autocomplete="new-password">
                            <button type="button" id="toggle-new-password" class="toggle-btn">
                                <i data-lucide="eye" id="eye-icon-new"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm-password" placeholder="••••••••" required autocomplete="new-password">
                            <button type="button" id="toggle-confirm-password" class="toggle-btn">
                                <i data-lucide="eye" id="eye-icon-confirm"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="reset-btn" class="submit-btn">
                        Update password
                    </button>
                </form>

                <div class="back-home" style="margin-top:1.5rem;">
                    <a href="auth.html">← Back to login</a>
                </div>

            </div>
        </div>
    </div>

    <script type="module" src="../js/pages/reset-password.js"></script>
    <script>
        window.addEventListener('load', () => lucide.createIcons());
    </script>
</body>
</html>
