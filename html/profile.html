<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | WatchEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/pages/profile.css">
    <link rel="stylesheet" href="../css/dark-mode.css">
</head>
<body>
    <script>if(localStorage.getItem('we-theme')==='dark')document.body.classList.add('dark')</script>

    <main class="profile-root container">

        <!-- Page header -->
        <div class="profile-header">
            <a href="#" class="profile-back" id="profile-back" aria-label="Go back">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </a>
            <p class="profile-eyebrow">Account</p>
            <h1 class="profile-title" id="profile-greeting">My Account</h1>
            <p class="profile-email" id="profile-email"></p>
        </div>

        <!-- Tab nav -->
        <nav class="profile-tabs" role="tablist">
            <button class="profile-tab profile-tab--active" data-tab="orders" role="tab" aria-selected="true">Orders</button>
            <button class="profile-tab" data-tab="wishlist" role="tab" aria-selected="false">Wishlist</button>
            <button class="profile-tab" data-tab="address" role="tab" aria-selected="false">Saved Address</button>
            <button class="profile-tab" data-tab="security" role="tab" aria-selected="false">Security</button>
        </nav>

        <!-- ── ORDERS TAB ── -->
        <section class="profile-panel" id="tab-orders">

            <div class="panel-loading" id="orders-loading">
                <span class="panel-spinner"></span>
                <p>Loading your orders…</p>
            </div>

            <div class="orders-empty" id="orders-empty" style="display:none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                    <path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                <p>No orders yet. Time to treat yourself.</p>
                <a href="men.html" class="profile-cta">Shop Collection</a>
            </div>

            <div id="orders-list"></div>

        </section>

        <!-- ── WISHLIST TAB ── -->
        <section class="profile-panel" id="tab-wishlist" style="display:none;">

            <div class="panel-loading" id="wishlist-loading">
                <span class="panel-spinner"></span>
                <p>Loading your wishlist…</p>
            </div>

            <div class="orders-empty" id="wishlist-empty" style="display:none;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <p>Your wishlist is empty. Save pieces you love.</p>
                <a href="men.html" class="profile-cta">Browse Collection</a>
            </div>

            <div id="wishlist-list"></div>

        </section>

        <!-- ── ADDRESS TAB ── -->
        <section class="profile-panel" id="tab-address" style="display:none;">

            <div class="panel-loading" id="address-loading">
                <span class="panel-spinner"></span>
                <p>Loading address…</p>
            </div>

            <form class="profile-form" id="address-form" style="display:none;" novalidate>
                <div class="form-section-label">Delivery Address</div>

                <div class="pf-row">
                    <div class="pf-group">
                        <label for="addr-name">Full Name</label>
                        <input type="text" id="addr-name" name="full_name" autocomplete="name" readonly>
                    </div>
                    <div class="pf-group">
                        <label for="addr-phone">Phone Number</label>
                        <input type="tel" id="addr-phone" name="phone" placeholder="+91 XXXXX XXXXX" autocomplete="tel">
                    </div>
                </div>

                <div class="pf-group">
                    <label for="addr-line1">Address Line 1</label>
                    <input type="text" id="addr-line1" name="address_line1" placeholder="House / Flat / Building" autocomplete="address-line1">
                </div>

                <div class="pf-group">
                    <label for="addr-line2">Address Line 2 <span class="pf-optional">(optional)</span></label>
                    <input type="text" id="addr-line2" name="address_line2" placeholder="Street / Area / Landmark" autocomplete="address-line2">
                </div>

                <div class="pf-row pf-row--3">
                    <div class="pf-group">
                        <label for="addr-city">City</label>
                        <input type="text" id="addr-city" name="city" placeholder="Mumbai" autocomplete="address-level2">
                    </div>
                    <div class="pf-group">
                        <label for="addr-state">State</label>
                        <input type="text" id="addr-state" name="state" placeholder="Maharashtra" autocomplete="address-level1">
                    </div>
                    <div class="pf-group">
                        <label for="addr-pin">PIN Code</label>
                        <input type="text" id="addr-pin" name="pin_code" placeholder="400001" autocomplete="postal-code" maxlength="6">
                    </div>
                </div>

                <div class="pf-actions">
                    <button type="submit" class="pf-btn-save" id="addr-save-btn">Save Address</button>
                    <span class="pf-feedback" id="addr-feedback"></span>
                </div>
            </form>

        </section>

        <!-- ── SECURITY TAB ── -->
        <section class="profile-panel" id="tab-security" style="display:none;">

            <form class="profile-form" id="security-form" novalidate>
                <div class="form-section-label">Change Password</div>

                <div class="pf-group">
                    <label for="sec-new">New Password</label>
                    <div class="pf-password-wrap">
                        <input type="password" id="sec-new" name="new_password" placeholder="Minimum 8 characters" autocomplete="new-password">
                        <button type="button" class="pf-eye" data-target="sec-new" aria-label="Toggle visibility">
                            <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-icon eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div class="pf-group">
                    <label for="sec-confirm">Confirm New Password</label>
                    <div class="pf-password-wrap">
                        <input type="password" id="sec-confirm" name="confirm_password" placeholder="Repeat new password" autocomplete="new-password">
                        <button type="button" class="pf-eye" data-target="sec-confirm" aria-label="Toggle visibility">
                            <svg class="eye-icon eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="eye-icon eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div class="pf-actions">
                    <button type="submit" class="pf-btn-save" id="sec-save-btn">Update Password</button>
                    <span class="pf-feedback" id="sec-feedback"></span>
                </div>
            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="../js/navbar-inject.js"></script>
    <script type="module" src="../js/navbar.js"></script>
    <script type="module" src="../js/pages/profile.js"></script>
</body>
</html>
